name: TestFlight

# Archives the iOS app from main and uploads it to App Store Connect, which makes it a TestFlight
# build once it has processed it. Run it by hand (Actions > TestFlight > Run workflow).
# Xcode manages the uploaded build number; the marketing version stays what main says.
# Realm schema version is maintained independently in DatabaseSchema.version.
#
# Signing needs no certificate on the runner. The archive is built unsigned, as CI builds, and the
# export signs it with a cloud-managed distribution certificate, authenticated with an App Store
# Connect API key (AGENTS.md, "TestFlight").

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # The Xcode the project is developed with, as in ci.yml.
  XCODE_VERSION: "26.6"
  PROJECT: YetAnotherEBookReader.xcodeproj
  TEAM_ID: L8WKJ3U7UT

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
      ARCHIVE: ${{ github.workspace }}/.build/YetAnotherEBookReader.xcarchive
      EXPORT_DIR: ${{ github.workspace }}/.build/export
      LOGS: ${{ github.workspace }}/.build/logs
    steps:
      # A TestFlight build is what main holds, not a branch on its way there.
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::TestFlight builds are made from main, not $GITHUB_REF_NAME."
          exit 1

      - uses: actions/checkout@v7

      - name: Install the App Store Connect API key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY_P8" ]; then
            echo "::error::Set the repository secrets APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID and APP_STORE_CONNECT_KEY_P8 (AGENTS.md, \"TestFlight\")."
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          mkdir -p "$LOGS"

      - name: Version
        run: |
          version=$(grep -m1 -o 'MARKETING_VERSION = [^;]*' "$PROJECT/project.pbxproj" | sed 's/MARKETING_VERSION = //')
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" YetAnotherEBookReader/Info.plist)
          echo "Source archive: D.S.Reader $version ($build) from $(git rev-parse --short HEAD). Xcode manages the uploaded build number." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('YetAnotherEBookReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Unsigned, as CI builds: the runner has no certificate. The export signs it.
      # -onlyUsePackageVersionsFromResolvedFile: build what Package.resolved records, or fail.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOGS/archive.log" | xcbeautify --renderer github-actions

      # Unsigned, the archive's embedded frameworks (GoogleMobileAds, UserMessagingPlatform) keep the
      # linker's ad hoc signature, whose identifier is "arm64-apple", not their bundle identifier.
      # The export signs them again but keeps that identifier, and App Store Connect rejects the
      # upload ("Invalid Signature. Code failed to satisfy specified code requirement(s)"). Signed ad
      # hoc here, they take their bundle identifiers, as Xcode's own signing would give them.
      # (CODE_SIGN_IDENTITY=- can't do it in the build: the iOS SDK refuses ad hoc signing.)
      - name: Give the embedded frameworks their identifiers
        run: |
          for framework in "$ARCHIVE"/Products/Applications/*.app/Frameworks/*.framework; do
            [ -e "$framework" ] || continue
            codesign --force --sign - --timestamp=none "$framework"
            codesign -dv "$framework" 2>&1 | grep '^Identifier='
          done

      # Signs the archive for the App Store with a cloud-managed distribution certificate and
      # uploads it. Xcode assigns an available build number during distribution,
      # keeping the marketing version from the archive. No source-file bump is needed.
      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$EXPORT_DIR" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$LOGS/export.log" | xcbeautify --renderer github-actions
          echo "Uploaded. App Store Connect processes the build before it shows in TestFlight." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Uploaded version
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          summary_path = Path(os.environ["EXPORT_DIR"]) / "DistributionSummary.plist"
          try:
              with summary_path.open("rb") as stream:
                  summary = plistlib.load(stream)
              app = next(
                  app
                  for products in summary.values() if isinstance(products, list)
                  for app in products
                  if isinstance(app, dict) and app.get("name", "").endswith(".app")
              )
              version = app["versionNumber"]
              build = app["buildNumber"]
          except (OSError, ValueError, KeyError, StopIteration) as error:
              print(f"::warning::Upload succeeded, but could not read the uploaded version: {error}. See export.log.")
          else:
              message = f"Uploaded: D.S.Reader {version} ({build})."
              print(message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
                  stream.write(message + "\n")
          PY

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # The export directory holds the distribution summary and packaging log, not the key.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs
          path: |
            .build/logs
            .build/export/*.plist
            .build/export/*.log
          if-no-files-found: ignore
          retention-days: 14
