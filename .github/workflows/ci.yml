name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Xcode the project is developed with, so CI and local runs agree.
  XCODE_VERSION: "26.6"
  # The calibre the contract tests run against.
  CALIBRE_VERSION: "9.11.0"
  PROJECT: YetAnotherEBookReader.xcodeproj

jobs:
  # A change to documentation only (root Markdown, .agents/) skips the jobs below. A job skipped by
  # its `if:` reports success, so the required checks still pass; skipping the whole workflow
  # (paths-ignore) would leave them pending. The jobs also run when this job fails, because
  # needs.changes.outputs.code is then empty, not "false".
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Classify
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: .github/scripts/changed-code.sh | tee -a "$GITHUB_OUTPUT"

  test:
    name: iOS unit tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
      LOGS: ${{ github.workspace }}/.build/logs
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          mkdir -p "$LOGS"

      - name: Pick simulator
        run: .github/scripts/pick-simulator.sh

      # Boot now, so the simulator settles while the app builds.
      - name: Boot simulator
        run: xcrun simctl boot "$SIMULATOR_UDID" || true

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('YetAnotherEBookReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # -onlyUsePackageVersionsFromResolvedFile: build what Package.resolved records, or fail.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader \
            -destination "$DESTINATION" \
            -only-testing:YetAnotherEBookReaderTests \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOGS/build-for-testing.log" | xcbeautify --renderer github-actions

      # bootstatus -b waits until the boot, data migration included, has finished.
      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # The UI journeys (YetAnotherEBookReaderUITests) aren't run here.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader \
            -destination "$DESTINATION" \
            -only-testing:YetAnotherEBookReaderTests \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$LOGS/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            2>&1 | tee "$LOGS/test.log" | xcbeautify --renderer github-actions

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-unit-tests
          path: .build/logs
          if-no-files-found: ignore
          include-hidden-files: true

  # The app's CalibreServerService against a real calibre-server (CalibreServerContractTests).
  # The unit-test job runs those tests too, but without a server they skip.
  calibre-contract:
    name: Calibre contract tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
      LOGS: ${{ github.workspace }}/.build/logs
      CALIBRE_DMG: ${{ github.workspace }}/.build/calibre/calibre.dmg
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          mkdir -p "$LOGS"

      - name: Pick simulator
        run: .github/scripts/pick-simulator.sh

      - name: Boot simulator
        run: xcrun simctl boot "$SIMULATOR_UDID" || true

      - name: Cache calibre
        uses: actions/cache@v6
        with:
          path: .build/calibre
          key: calibre-dmg-${{ env.CALIBRE_VERSION }}

      # The command-line tools run from the app bundle; nothing is installed system-wide.
      - name: Install calibre
        run: |
          if [ ! -f "$CALIBRE_DMG" ]; then
            mkdir -p "$(dirname "$CALIBRE_DMG")"
            curl -fsSL -o "$CALIBRE_DMG" "https://download.calibre-ebook.com/$CALIBRE_VERSION/calibre-$CALIBRE_VERSION.dmg"
          fi
          yes | hdiutil attach -nobrowse -readonly -noverify -mountpoint "$RUNNER_TEMP/calibre-dmg" "$CALIBRE_DMG" > /dev/null
          ditto "$RUNNER_TEMP/calibre-dmg/calibre.app" "$RUNNER_TEMP/calibre.app"
          hdiutil detach -quiet "$RUNNER_TEMP/calibre-dmg"
          echo "CALIBRE_BIN=$RUNNER_TEMP/calibre.app/Contents/MacOS" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/calibre.app/Contents/MacOS/calibre-server" --version

      # Seeds a library and two users, and sets the TEST_RUNNER_YABR_CALIBRE_* variables.
      - name: Start calibre-server
        run: .github/scripts/calibre-contract-server.sh start "$LOGS/calibre"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('YetAnotherEBookReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader \
            -destination "$DESTINATION" \
            -only-testing:YetAnotherEBookReaderTests/CalibreServerContractTests \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOGS/build-for-testing.log" | xcbeautify --renderer github-actions

      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # A skipped test means the server wasn't configured: fail rather than pass on nothing.
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader \
            -destination "$DESTINATION" \
            -only-testing:YetAnotherEBookReaderTests/CalibreServerContractTests \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$LOGS/TestResults.xcresult" \
            -test-timeouts-enabled YES \
            2>&1 | tee "$LOGS/test.log" | xcbeautify --renderer github-actions
          if grep -qE "^Test Case .* skipped" "$LOGS/test.log"; then
            echo "::error::Contract tests were skipped: the calibre-server variables didn't reach them"
            exit 1
          fi

      - name: Stop calibre-server
        if: always()
        run: .github/scripts/calibre-contract-server.sh stop "$LOGS/calibre"

      # Includes the server's log and access log.
      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: calibre-contract-tests
          path: .build/logs
          if-no-files-found: ignore
          include-hidden-files: true

  catalyst:
    name: Mac Catalyst build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SPM_DIR: ${{ github.workspace }}/.build/spm
      DERIVED_DATA: ${{ github.workspace }}/.build/DerivedData
      LOGS: ${{ github.workspace }}/.build/logs
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app"
          xcodebuild -version
          mkdir -p "$LOGS"

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('YetAnotherEBookReader.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme YetAnotherEBookReader-Catalyst \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$LOGS/build.log" | xcbeautify --renderer github-actions

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: catalyst-build
          path: .build/logs
          if-no-files-found: ignore
          include-hidden-files: true
